[project]
name = "backdoord"
version = "0.1.0"
description = "Research toolkit for studying data poisoning and backdoors"
requires-python = "~=3.14.0"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=2.19.1",
    "fastapi>=0.135.1",
    "fire>=0.7.1",
    "gradio>=6.9.0",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "packaging>=24.1",
    "pandas>=3.0.1",
    "peft>=0.18.1",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "sentencepiece>=0.2.1",
    "sse-starlette>=3.3.2",
    "tiktoken>=0.12.0",
    "torch>=2.10.0",
    "tqdm>=4.66.5",
    "transformers>=5.3.0",
    "trl>=0.10.1",
    "typer>=0.24.1",
    "uvicorn>=0.41.0",
    "hydra-core>=1.3",
    "hydra-zen>=0.13",
]

[project.optional-dependencies]
wandb = [
    "wandb>=0.19",
]
lm-eval = [
    "lm-eval>=0.4",
]

# transformerlens = [
#     "colorama>=0.4.6",
#     "einops>=0.8.2",
#     "jaxtyping>=0.3.7",
#     "numpy<2.0.0",
#     "transformer-lens>=2.16.1",
# ]


[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "pre-commit>=4.0",
    "pytest>=9.0.2",
    "ruff>=0.15.5",
    "ty>=0.0.21",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"

# [project.scripts]
# bd = "src.backdoor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backdoord"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "ANN001",  # missing type annotation for function argument
    "ANN002",  # missing type annotation for *args
    "ANN003",  # missing type annotation for **kwargs
    "ANN201",  # missing return type for public function (None-returning funcs exempt via suppress-none-returning)
    "ANN202",  # missing return type for private function (None-returning funcs exempt via suppress-none-returning)
]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true  # don't require -> None for functions that implicitly return None

# [tool.ty]
