[project]
name = "backdoord"
version = "0.1.0"
description = "Research toolkit for studying data poisoning and backdoors"
requires-python = "~=3.13.0"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=2.19.1",
    "fastapi>=0.135.1",
    "fire>=0.7.1",
    "gradio>=6.9.0",
    "matplotlib>=3.10.8",
    # vllm in the [prune] extra caps numpy at <2.3; widen so both extras resolve.
    "numpy>=1.24,<3",
    "packaging>=24.1",
    "pandas>=3.0.1",
    "peft>=0.18.1",
    "protobuf>=5.29.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "sentencepiece>=0.2.1",
    "sse-starlette>=3.3.2",
    "tiktoken>=0.12.0",
    "torch>=2.10.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "tqdm>=4.66.5",
    # Range accepts tf4 or tf5: vllm/lm-eval in the [prune] extra currently cap at <5.
    # Drop the upper bound once vllm ships tf5 support (tracking: vllm>=0.20).
    "transformers>=4.56.0,<6",
    "trl>=0.10.1",
    "typer>=0.24.1",
    "uvicorn>=0.41.0",
    "bitsandbytes>=0.46.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "marimo>=0.23.5",
]

[project.optional-dependencies]
wandb = [
    "wandb>=0.19",
]
lm-eval = [
    "lm-eval>=0.4",
]
prune = [
    "hydra-core>=1.3.2",
    "hydra-zen>=0.16.0",
    "lm-eval>=0.4.11",
    "ray[data,default,train,tune]>=2.54.0",
    "vllm>=0.17.0",
]
viz = [
    "plotly>=6.1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "pre-commit>=4.0",
    "pytest>=9.0.2",
    "ruff>=0.15.5",
    "ty>=0.0.21",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'win32'",
]
override-dependencies = [
    "torch>=2.10.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "bitsandbytes>=0.46.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # vllm declares torchvision/torchaudio but we don't use them; the PyPI wheels
    # have ABI conflicts with the cu126 torch build.  Exclude by capping at 0.
    "torchvision>=99.0.0; sys_platform == 'never'",
    "torchaudio>=99.0.0; sys_platform == 'never'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[project.scripts]
bdd = "backdoord.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backdoord"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "ANN001",  # missing type annotation for function argument
    "ANN002",  # missing type annotation for *args
    "ANN003",  # missing type annotation for **kwargs
    "ANN201",  # missing return type for public function (None-returning funcs exempt via suppress-none-returning)
    "ANN202",  # missing return type for private function (None-returning funcs exempt via suppress-none-returning)
    "D100",    # missing docstring in public module
    "D101",    # missing docstring in public class
    "D102",    # missing docstring in public method
    "D103",    # missing docstring in public function
    "D104",    # missing docstring in public package
    "D107",    # missing docstring in __init__
    "T201",    # no bare print()
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["T201"]
# Ported from andy/train under looser docstring rules. Grandfather for now;
# TODO: add docstrings incrementally and drop these exemptions.
"src/backdoord/pruning/**" = ["D100", "D101", "D102", "D103", "D104", "D107"]
"tests/test_pruning_*.py" = ["D100", "D101", "D102", "D103", "D104", "D107"]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true  # don't require -> None for functions that implicitly return None

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
# viz.py pulls in plotly (only available under the [viz] extra); third_party is vendored upstreams.
exclude = ["src/backdoord/pruning/viz.py", "third_party"]

